
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLO MODE | Fashion Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 bg-white font-sans leading-relaxed text-neutral-800">

  <!-- Navigation -->
  <header class="flex flex-wrap items-center justify-between gap-4 px-[7%] py-6">
    <a href="#" class="text-2xl font-bold tracking-widest">FLO MODE</a>

    <nav class="flex flex-wrap gap-5">
      <a href="#home" class="hover:text-amber-800 focus-visible:outline-2">Home</a>
      <a href="#collection" class="hover:text-amber-800 focus-visible:outline-2">Collection</a>
      <a href="#about" class="hover:text-amber-800 focus-visible:outline-2">About</a>
      <a href="#contact" class="hover:text-amber-800 focus-visible:outline-2">Contact</a>
    </nav>

    <a href="#collection"
       class="rounded bg-neutral-800 px-5 py-2 text-white hover:bg-amber-800">
      Shop Now
    </a>
  </header>

  <main>
    <!-- Hero -->
    <section id="home"
      class="flex flex-col items-center gap-10 bg-orange-50 px-[7%] py-12 md:flex-row md:py-16">

      <div class="flex-1">
        <p class="mb-3 text-sm font-bold tracking-widest text-amber-800">
          NEW SEASON · NEW STYLE
        </p>

        <h1 class="mb-5 text-4xl font-bold leading-tight md:text-5xl">
          Style that speaks for you.
        </h1>

        <p class="mb-7 text-neutral-600">
          Discover timeless fashion pieces designed to make
          every day feel special.
        </p>

        <a href="#collection"
           class="inline-block rounded bg-neutral-800 px-6 py-3 text-white hover:bg-amber-800">
          Explore Collection
        </a>
      </div>

      <div class="w-full flex-1">
        <img src="image8.png"
             alt="Fashion model wearing a stylish outfit"
             class="h-80 w-full rounded object-cover md:h-[420px]">
      </div>
    </section>

    
</body>
</html>
